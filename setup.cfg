# Configuration is partially borrowed from:
# https://github.com/wemake-services/wemake-python-styleguide/blob/master/setup.cfg

[flake8]
# wemake-python-styleguide configuration options:
# https://wemake-python-styleguide.readthedocs.io/en/latest/pages/usage/configuration.html
max-returns = 2
max-arguments = 10
max-local-variables = 10
max-methods = 12
max-imports = 20
# Plugins:
max-complexity = 8
max-line-complexity = 15
max-line-length = 120
max-module-members = 10

# Exclude some checks globally:
ignore =
    B008,
    D, DAR,
    E117, E203, E704
    I001, I002, I003, I004, I005,
    S608,
    WPS306, WPS237, WPS305,
    WPS326, WPS404, WPS323, WPS226,
    WPS462, WPS217, WPS602, WPS238,
    WPS615, WPS204, WPS214, WPS433,
    WPS421, WPS212, WPS476, W503, W504
    WPS412

[isort]
# isort configuration:
# https://pycqa.github.io/isort/docs/configuration/profiles.html
profile = wemake

[darglint]
docstring_style=google

[mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
disable_error_code = misc

enable_error_code = truthy-bool, redundant-expr
allow_redefinition = false
check_untyped_defs = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
disallow_untyped_defs = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = false
local_partial_types = true
no_implicit_optional = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
explicit_package_bases = true
